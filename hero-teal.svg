<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Poppins','Inter','Noto Sans Bengali','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f3a"/>
      <stop offset="55%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowText" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="160" cy="60" r="280" fill="url(#glowTeal)"/>
  <circle cx="1080" cy="400" r="300" fill="url(#glowCyan)"/>
  <path d="M0 330 C 240 290, 420 370, 640 330 S 1000 290, 1200 340 L1200 420 L0 420 Z" fill="#14b8a6" fill-opacity="0.07"/>
  <path d="M0 360 C 260 320, 480 395, 700 355 S 1050 320, 1200 365" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Left: Title block -->
  <text x="70" y="128" font-size="30" font-weight="600" fill="#5eead4" letter-spacing="8">AI ASSISTANT · BANGLA FIRST</text>
  <text x="66" y="230" font-size="118" font-weight="800" fill="url(#titleGrad)" letter-spacing="3" filter="url(#glowText)">PARISA-AI</text>
  <rect x="70" y="256" width="520" height="3" rx="2" fill="url(#rule)"/>
  <text x="72" y="300" font-size="24" font-weight="600" fill="#e0f7fa">চ্যাট সার্চ · ফাইল বিশ্লেষণ · বাংলা ভয়েস</text>
  <text x="72" y="336" font-size="19" fill="#7dd3d8">বাংলা-প্রথম এআই সহকারী, যা স্থানীয় চ্যাট আর্কাইভে প্রশ্নের উত্তর খোঁজে</text>
  <text x="72" y="372" font-size="18" font-weight="700" fill="url(#gold)" letter-spacing="1.5">THIS APP&#8217;S DEVELOPMENT BY DADA</text>

  <!-- Right: Feature cards -->
  <g filter="url(#shadow)">
    <rect x="760" y="50" width="200" height="136" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.3"/>
  </g>
  <circle cx="800" cy="92" r="20" fill="url(#iconGrad)"/>
  <circle cx="796" cy="88" r="7" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="801" y1="93" x2="808" y2="100" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="780" y="140" font-size="18" font-weight="700" fill="#ffffff">চ্যাট সার্চ</text>
  <text x="780" y="164" font-size="13" fill="#7dd3d8">প্রাকৃতিক ভাষায় প্রশ্ন</text>

  <g filter="url(#shadow)">
    <rect x="980" y="50" width="200" height="136" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.3"/>
  </g>
  <circle cx="1020" cy="92" r="20" fill="url(#iconGrad)"/>
  <path d="M1008 98 L1016 88 L1023 94 L1034 80" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1000" y="140" font-size="18" font-weight="700" fill="#ffffff">পরিসংখ্যান</text>
  <text x="1000" y="164" font-size="13" fill="#7dd3d8">মাসভিত্তিক সারসংক্ষেপ</text>

  <g filter="url(#shadow)">
    <rect x="760" y="200" width="200" height="136" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.3"/>
  </g>
  <circle cx="800" cy="242" r="20" fill="url(#iconGrad)"/>
  <path d="M790 238 h7 l2 3 h11 v11 h-20 z" fill="#ffffff"/>
  <text x="780" y="290" font-size="18" font-weight="700" fill="#ffffff">ফাইল বিশ্লেষণ</text>
  <text x="780" y="314" font-size="13" fill="#7dd3d8">ছবি, PDF ও টেক্সট</text>

  <g filter="url(#shadow)">
    <rect x="980" y="200" width="200" height="136" rx="22" fill="url(#card)" stroke="#5eead4" stroke-opacity="0.3"/>
  </g>
  <circle cx="1020" cy="242" r="20" fill="url(#iconGrad)"/>
  <path d="M1012 238 h4 l5 -4 v12 l-5 -4 h-4 z" fill="#ffffff"/>
  <path d="M1026 236 q3 6 0 12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M1031 233 q5 9 0 18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <text x="1000" y="290" font-size="18" font-weight="700" fill="#ffffff">বাংলা ভয়েস</text>
  <text x="1000" y="314" font-size="13" fill="#7dd3d8">Edge TTS উত্তর পড়ে শোনায়</text>

  <!-- Footer -->
  <text x="72" y="400" font-size="13" fill="#67b8c0" letter-spacing="1">VERSION V-29  ·  NODE.JS + EXPRESS</text>
  <text x="1128" y="400" font-size="13" fill="#67b8c0" text-anchor="end" letter-spacing="1">GITHUB · DADA310724/PARISA-AI</text>
</svg>
